[package]
name = "license-forge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Forge your LICENSE in seconds."
license = "MIT"
readme = "README.md"
repository = "https://github.com/xxxyixuan/license-forge"
keywords = ["license", "spdx", "cli", "copyright"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lic"
path = "src/main.rs"

[dependencies]
# CLI 解析（derive 模式）
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# 序列化：JSON 输出
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误处理
anyhow = "1"
thiserror = "1"
# 许可证名模糊匹配建议
strsim = "0.11"
# 当前年份（local-offset 用于取本地时区年份）
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
# 集成测试用 std::process::Command + cargo 注入的 CARGO_BIN_EXE_lic 驱动，
# 而不是 assert_cmd：后者在 spawn 时会无条件给子进程开 stdin 管道，
# 部分 Windows 环境（含本项目开发机）下会直接报 os error 231 (ERROR_PIPE_BUSY)，
# 导致全部用例无法运行。
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
